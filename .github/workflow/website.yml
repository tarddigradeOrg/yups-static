---
name: Static deployment
on:
  push:
    branches:
      - main
    path:
      - 'site/**'
env:
  REGISTRY: docker.io

jobs:
  build_and_deploy:
    name: build_and_deploy
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout SERVICE repo
        uses: actions/checkout@v3
        id: checkout_repo
        with:
          ref: ${{ inputs.BRANCH }}

      - name: Set outputs
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Save build number
        id: build-number-save
        run: echo ${{ steps.vars.outputs.sha_short }} > buildimage.txt

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: |
            website-statics
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha

      # - name: Login to Container registry
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKERHUB_LOGIN }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build, tag and push container
        id: build-push-image
        run: |
          docker build . -t ghcr.io/yups-static/website:${{ env.DOCKER_METADATA_OUTPUT_TAGS }}
          docker push ghcr.io/yups-static/website:${{ env.DOCKER_METADATA_OUTPUT_TAGS }}

      - name: Render image version
        run: |
          sed -i "s/RENDER/${{ env.DOCKER_METADATA_OUTPUT_TAGS }}/g" k8s/deployment.yml

      - name: Push rendered file to remote repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'k8s/'
          destination_repo: 'NicolasTobias/arenero'
          destination_folder: 'website-yups'
          user_email: 'bender@leveL5.dev'
          user_name: 'Bender'
          commit_message: 'Bender says: ${{ github.event.head_commit.message }}'
